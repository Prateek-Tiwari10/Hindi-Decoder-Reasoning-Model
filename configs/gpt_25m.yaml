# GPT-style decoder: the fixed baseline (never retrained).
# Values are exactly the `model_config` embedded in
# artifacts/checkpoints/gpt/final_16k.pt (step 16,125).
arch: gpt
language: hindi
vocab_size: 16000
d_model: 384
n_layers: 11
n_heads: 6
d_ff: 1536                 # 4 x d_model, GELU
context_len: 512
dropout: 0.1
positional: learned_absolute
pre_norm: true
activation: gelu
tie_weights: true
layer_norm_eps: 1.0e-05
